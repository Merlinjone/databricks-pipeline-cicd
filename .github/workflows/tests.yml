name: Python unit tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r project-3-automation-cicd/requirements-dev.txt
      - name: Run tests
        working-directory: project-3-automation-cicd
        run: python -m pytest -q
